[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soapalin"
dynamic = ["version"]
description = "Zimbra provisioning and mailbox migration tool"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "cryptography>=41,<47; python_version >= '3.8'",
    "cryptography==36.0.2; python_version < '3.8'",
    "cffi==1.15.1; python_version < '3.8'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
soapalin = "soaplun.cli:main"

[tool.setuptools.dynamic]
version = {attr = "soaplun.__version__"}

[tool.setuptools.packages.find]
namespaces = true
include = ["soaplun*", "vendor*"]
