[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soapalin"
dynamic = ["version"]
description = "Zimbra provisioning and mailbox migration tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "cryptography>=41,<47",
]

[project.scripts]
soapalin = "soaplun.cli:main"

[tool.setuptools.dynamic]
version = {attr = "soaplun.__version__"}

[tool.setuptools.packages.find]
namespaces = true
include = ["soaplun*", "vendor*"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["soaplun", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "soaplun/storage.py",
    "soaplun/parallel.py",
    "soaplun/models.py",
    "soaplun/inputs.py",
    "soaplun/mapping.py",
    "soaplun/schema.py",
    "soaplun/cleanup.py",
    "soaplun/planner.py",
    "soaplun/context.py",
    "soaplun/mailbox_common.py",
    "soaplun/settings_common.py",
]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false

[tool.coverage.run]
source = ["soaplun"]
omit = ["soaplun/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
