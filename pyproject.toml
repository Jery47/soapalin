[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soapalin"
dynamic = ["version"]
description = "Zimbra provisioning and mailbox migration tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "cryptography>=41,<47",
]

[project.scripts]
soapalin = "soapalin.cli:main"

[tool.setuptools.dynamic]
version = {attr = "soapalin.__version__"}

[tool.setuptools.packages.find]
namespaces = true
include = ["soapalin*", "vendor*"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["soapalin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["soapalin"]

ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false

[tool.coverage.run]
source = ["soapalin"]
omit = ["soapalin/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
